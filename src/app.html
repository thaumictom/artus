<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      if (location.pathname.startsWith('/artus')) {
        document.documentElement.classList.add('artus-document');
      }
    </script>
    <style>
      html.artus-document, html.artus-document body:not(:has(.artus-app-shell)) { background: #22292b !important; color-scheme: dark; }
    </style>
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
